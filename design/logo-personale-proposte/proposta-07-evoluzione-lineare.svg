<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" role="img" aria-labelledby="title desc">
  <title id="title">Evoluzione lineare del logo personale GF</title>
  <desc id="desc">Marchio personale con iniziali GF separate e chiaramente leggibili, costruite con linee concentriche derivate dal logo DJ.</desc>
  <rect width="1400" height="1200" fill="#FFFFFF"/>

  <defs>
    <!-- Quattro binari reali: stesso spessore e distanza costante in ogni segmento. -->
    <g id="gf-linear" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="round">
      <!-- G: quattro tracciati indipendenti e concentrici. -->
      <path d="M-42-120H-84C-134-120-164-72-164 0S-134 120-84 120H-28V40H-100"/>
      <path d="M-42-112H-84C-129-112-156-68-156 0S-129 112-84 112H-36V48H-100"/>
      <path d="M-42-104H-84C-124-104-148-64-148 0S-124 104-84 104H-44V56H-100"/>
      <path d="M-42-96H-84C-119-96-140-60-140 0S-119 96-84 96H-52V64H-100"/>

      <!-- F: quattro aste e quattro bracci, tutti dello stesso spessore. -->
      <path d="M0 120V-120H118"/>
      <path d="M8 120V-112H118"/>
      <path d="M16 120V-104H118"/>
      <path d="M24 120V-96H118"/>
      <path d="M24-24H96"/>
      <path d="M24-16H96"/>
      <path d="M24-8H96"/>
      <path d="M24 0H96"/>
    </g>
  </defs>

  <text x="700" y="68" text-anchor="middle" fill="#71717A" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" letter-spacing="6">IDENTITÀ PERSONALE · PROPOSTA GF</text>

  <!-- Marchio principale -->
  <g transform="translate(700 352)">
    <circle r="224" fill="none" stroke="#B88A2C" stroke-width="3.5"/>
    <circle r="216" fill="none" stroke="#B88A2C" stroke-width="3.5"/>
    <circle r="208" fill="none" stroke="#B88A2C" stroke-width="3.5"/>

    <!-- La F è accorciata e l'intero gruppo è centrato sui propri limiti reali. -->
    <use href="#gf-linear" transform="translate(23 0)" color="#18181B"/>
  </g>

  <!-- Firma -->
  <text x="700" y="666" text-anchor="middle" fill="#18181B" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="700" letter-spacing="8">GIORGIO FIORAVANTI</text>

  <!-- Barra tricolore molto sottile e più lunga -->
  <g transform="translate(385 710)">
    <rect width="210" height="2.5" fill="#169B62"/>
    <rect x="210" width="210" height="2.5" fill="#ECEBE6"/>
    <rect x="420" width="210" height="2.5" fill="#CE2B37"/>
  </g>
  <text x="700" y="768" text-anchor="middle" fill="#52525B" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="500" letter-spacing="7">POLITICA · EVENTI · GRAFICA</text>

  <!-- Sistema di applicazione -->
  <path d="M115 835H1285" stroke="#E4E4E7"/>
  <text x="700" y="875" text-anchor="middle" fill="#71717A" font-family="DejaVu Sans, sans-serif" font-size="14" letter-spacing="5">SISTEMA DI RIDUZIONE E APPLICAZIONE</text>

  <!-- Versione semplificata per piccole dimensioni -->
  <g transform="translate(300 1020)">
    <circle r="92" fill="none" stroke="#B88A2C" stroke-width="2.2"/>
    <circle r="87" fill="none" stroke="#B88A2C" stroke-width="2.2"/>
    <circle r="82" fill="none" stroke="#B88A2C" stroke-width="2.2"/>
    <use href="#gf-linear" transform="translate(9 0) scale(.38)" color="#18181B"/>
    <text x="0" y="130" text-anchor="middle" fill="#71717A" font-family="DejaVu Sans, sans-serif" font-size="13" letter-spacing="3">FAVICON</text>
  </g>

  <!-- Versione monocromatica -->
  <g transform="translate(700 1020)">
    <circle r="92" fill="none" stroke="#18181B" stroke-width="2.2"/>
    <circle r="87" fill="none" stroke="#18181B" stroke-width="2.2"/>
    <circle r="82" fill="none" stroke="#18181B" stroke-width="2.2"/>
    <use href="#gf-linear" transform="translate(9 0) scale(.38)" color="#18181B"/>
    <text x="0" y="130" text-anchor="middle" fill="#71717A" font-family="DejaVu Sans, sans-serif" font-size="13" letter-spacing="3">MONOCROMO</text>
  </g>

  <!-- Versione negativa -->
  <g transform="translate(1100 1020)">
    <rect x="-112" y="-112" width="224" height="224" rx="28" fill="#18181B"/>
    <circle r="92" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
    <circle r="87" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
    <circle r="82" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
    <use href="#gf-linear" transform="translate(9 0) scale(.38)" color="#FFFFFF"/>
    <text x="0" y="150" text-anchor="middle" fill="#71717A" font-family="DejaVu Sans, sans-serif" font-size="13" letter-spacing="3">NEGATIVO</text>
  </g>
</svg>
